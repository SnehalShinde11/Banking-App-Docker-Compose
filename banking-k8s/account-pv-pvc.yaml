apiVersion: v1
kind: PersistentVolume
metadata:
  name: account-pv

spec:
  capacity:
    storage: 1Gi

  accessModes:
    - ReadWriteOnce

  persistentVolumeReclaimPolicy: Retain

  hostPath:
    path: /data/banking/account

---

apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: account-pvc
  namespace: banking

spec:
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 1Gi
